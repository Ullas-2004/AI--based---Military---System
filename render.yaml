services:
  - type: web
    name: aegisai-backend
    env: python
    buildCommand: pip install -r api/requirements.txt
    startCommand: waitress-serve --port=$PORT --call api.app:create_app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: aegis_ai_db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
